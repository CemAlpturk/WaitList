name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: make app
      - name: Zip
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: WaitList.app
          path: build/WaitList.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/WaitList.zip
          generate_release_notes: true
